# Nginx 单入口网关（docker-compose 阶段四）
# 分流规则：/ws/admin、/api/eoms → ws-design 实例；/aws → approval-workflow 实例
# 生产
upstream qy-core-wdv {
    server qy-core-wdv:3000;
}

upstream qy-core-aws {
    server qy-core-aws:3001;
}

server {
    listen 80;
    server_name _;

    # 通用代理头
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ws-design 配置/设计端
    location /ws/admin/ {
        proxy_pass http://wdv:3000/ws/admin/;
    }
    location /api/eoms/ {
        proxy_pass http://wdv:3000/api/eoms/;
    }

    # approval-workflow 流程/审批端
    location /aws/ {
        proxy_pass http://aws:3001/aws/;
    }

    # 兜底：转到 ws-design 实例
    location / {
        proxy_pass http://wdv:3000/;
    }
}
