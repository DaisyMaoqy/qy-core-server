# 双实例部署（阶段四）
# 同一份代码按产品拆模块，分别起两个进程；经 Nginx 单入口分流：
#   宿主 3000 → nginx → /ws/admin、/api/eoms → wdv；/aws → aws
# 数据库：单 MySQL 实例承载 3 个独立 schema（auth_db / ws_design_db / approval_workflow_db），
# 由 prisma/init.sql 在建库时创建并授权给应用账号 ws_design。

services:
  # 单 MySQL 实例，承载三个独立 schema
  mysql:
    image: mysql:8.0 #自带 linux/arm64 镜像 生产：image: 你的ACR地址/mysql:8.0
    container_name: qy-core-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD} # 生产 强密码 root_2026_prodqaZ!
      MYSQL_DATABASE: ${MYSQL_DATABASE} 
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD} # 生产 强密码 ws_design_2026prodqaZ!
    ports:
      - "3306:3306" # 生产需要注释
    volumes:
      - mysql_data:/var/lib/mysql
      - ./prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 产品实例：ws-design（配置/设计端，前缀 ws/admin，连 auth_db + ws_design_db）
  wdv:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qy-core-wdv
    restart: always
    environment:
      ENV_FILE: .env.wdv
      ENABLE_MODULE: ${ENABLE_MODULE}
      PORT: "3000"
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL}
      WS_DESIGN_DATABASE_URL: ${WS_DESIGN_DATABASE_URL}
      AWS_DATABASE_URL: ${AWS_DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
    volumes:
      - ./prisma:/app/prisma
    depends_on:
      mysql:
        condition: service_healthy

  # 产品实例：approval-workflow（流程/审批端，前缀 aws，连 auth_db + approval_workflow_db）
  aws:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qy-core-aws
    restart: always
    environment:
      ENV_FILE: .env.aws
      ENABLE_MODULE: ${ENABLE_MODULE}
      PORT: "3001"
      # 只跑 aws 依赖的两个库迁移（auth_db 登录 + approval_workflow_db），不依赖 ws-design 库
      DEPLOY_SCRIPT: prisma:deploy:aws
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL}
      WS_DESIGN_DATABASE_URL: ${WS_DESIGN_DATABASE_URL}
      AWS_DATABASE_URL: ${AWS_DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
    volumes:
      - ./prisma:/app/prisma
    depends_on:
      mysql:
        condition: service_healthy

  # Nginx 单入口网关：按路径分流到两个产品实例
  nginx:
    image: nginx:alpine
    container_name: qy-core-nginx
    restart: always
    ports:
      - "3000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - wdv
      - aws

volumes:
  mysql_data:
